[workspace]
members = [
    "rust/hpke-http",
    "python/native",
    "typescript/native",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
authors = ["Duale AI"]
license = "Apache-2.0"
repository = "https://github.com/dualeai/hpke-http"

[workspace.dependencies]
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = { version = "0.4.2", default-features = false }
flate2 = "1.1.9"
hkdf = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "chacha", "x25519"] }
js-sys = "=0.3.105"
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module"] }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
ruzstd = "0.9.0"
sha2 = { version = "0.11.0", default-features = false }
serde_json = "1.0.145"
thiserror = "2.0.20"
wasm-bindgen = "=0.2.128"
zeroize = { version = "1.9.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
