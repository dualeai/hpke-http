<!doctype html>
<meta charset="utf-8" />
<title>hpke-http browser smoke test</title>
<body data-result="pending">pending</body>
<script type="module">
  import {
    RESPONSE_MEDIA_TYPE,
    Server,
    createHpkeFetch,
    generateKeyPair,
    initialize,
  } from "../dist/browser.js";

  const text = new TextEncoder();
  let hpkeFetch;
  let discoveryFetch;
  let badDiscoveryFetch;
  let server;
  async function report(status, detail = "") {
    document.body.dataset.result = status;
    document.body.textContent = detail || status;
    await globalThis.fetch(`/result?status=${encodeURIComponent(status)}`, {
      method: "POST",
      headers: { "content-type": "text/plain; charset=utf-8" },
      body: detail,
    });
  }

  try {
    await initialize();
    const keys = generateKeyPair();
    const keyId = text.encode("browser-key");
    const psk = text.encode("a 32-byte minimum browser credential");
    const pskId = text.encode("browser-tenant");
    server = new Server(keys.privateKey, keyId);
    hpkeFetch = createHpkeFetch({
      endpoint: "https://api.example.test/protected",
      key: { kind: "pin", publicKey: keys.publicKey, keyId },
      psk,
      pskId,
      fetch: async (input, init) => {
        const outer = new Request(input, init);
        const opened = server
          .preparse(new Uint8Array(await outer.arrayBuffer()))
          .authenticate(psk)
          .admit({ accepted: true });
        if (["/browser-sse", "/browser-late", "/browser-abort"].includes(opened.request.path)) {
          const writer = opened.startResponse(200, [
            { name: "content-type", value: "text/event-stream; charset=utf-8" },
          ]);
          try {
            const first = new Uint8Array([
              ...writer.start,
              ...writer.sealSseBlock(text.encode(": ready\n\n")),
            ]);
            const nextBlock = writer.sealSseBlock(text.encode("data: two\n\n"));
            if (opened.request.path === "/browser-late") {
              nextBlock[nextBlock.length - 1] ^= 1;
            }
            const end = writer.finish();
            const live = opened.request.path === "/browser-sse";
            const last = live ? end : new Uint8Array([...nextBlock, ...end]);
            return await globalThis.fetch("/relay", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                first: Array.from(first),
                ...(live ? { middle: Array.from(nextBlock) } : {}),
                last: Array.from(last),
              }),
              signal: outer.signal,
            });
          } finally {
            writer.close();
          }
        }
        if (opened.request.path !== "/browser") {
          throw new Error(`unexpected authenticated path: ${opened.request.path}`);
        }
        const envelope = opened.protectResponse({
          status: 200,
          headers: [{ name: "content-type", value: "text/plain" }],
          body: text.encode("browser-ok"),
        });
        return new Response(envelope, {
          status: 200,
          headers: { "content-type": RESPONSE_MEDIA_TYPE },
        });
      },
    });

    const response = await hpkeFetch("https://api.example.test/browser");
    if (response.status !== 200 || (await response.text()) !== "browser-ok") {
      throw new Error("authenticated browser Fetch response did not round-trip");
    }
    const live = await hpkeFetch("https://api.example.test/browser-sse");
    if (live.status !== 200 || live.body === null) {
      throw new Error("browser SSE response did not expose a checked START");
    }
    const reader = live.body.getReader();
    const firstRead = await Promise.race([
      reader.read(),
      new Promise((_, reject) => setTimeout(() => reject(new Error("first browser SSE block timed out")), 5000)),
    ]);
    if (new TextDecoder().decode(firstRead.value) !== ": ready\n\n") {
      throw new Error("first checked browser SSE block did not match");
    }
    // The local relay holds the second block and END as two separate parts.
    const released = await globalThis.fetch("/relay", { method: "PUT" });
    if (released.status !== 204) {
      throw new Error("browser relay did not release the second block");
    }
    const secondRead = await Promise.race([
      reader.read(),
      new Promise((_, reject) => setTimeout(() => reject(new Error("second browser SSE block timed out")), 5000)),
    ]);
    if (new TextDecoder().decode(secondRead.value) !== "data: two\n\n") {
      throw new Error("second checked browser SSE block did not match");
    }
    const finished = await globalThis.fetch("/relay", { method: "PUT" });
    if (finished.status !== 204 || !(await reader.read()).done) {
      throw new Error("browser SSE reply did not finish after checked END and EOF");
    }
    const late = await hpkeFetch("https://api.example.test/browser-late");
    if (late.body === null) throw new Error("late-error response has no body");
    const lateReader = late.body.getReader();
    if (new TextDecoder().decode((await lateReader.read()).value) !== ": ready\n\n") {
      throw new Error("late-error response lost its first checked block");
    }
    await globalThis.fetch("/relay", { method: "PUT" });
    let lateFailed = false;
    try {
      await lateReader.read();
    } catch (error) {
      lateFailed = error?.code === "authentication_failed";
    }
    if (!lateFailed) throw new Error("browser did not report the later bad tag");

    const controller = new AbortController();
    const aborted = await hpkeFetch("https://api.example.test/browser-abort", { signal: controller.signal });
    if (aborted.body === null) throw new Error("abort response has no body");
    const abortReader = aborted.body.getReader();
    if (new TextDecoder().decode((await abortReader.read()).value) !== ": ready\n\n") {
      throw new Error("abort response lost its first checked block");
    }
    controller.abort();
    let abortFailed = false;
    try {
      await abortReader.read();
    } catch {
      abortFailed = true;
    }
    if (!abortFailed) throw new Error("browser body did not stop after caller abort");
    await globalThis.fetch("/relay", { method: "PUT" });

    const endpoint = new URL(location.href).searchParams.get("discovery_endpoint");
    if (endpoint === null) throw new Error("browser key endpoint is missing");
    const apiOrigin = new URL(endpoint).origin;
    document.cookie = "browser-cookie=must-not-leak; Secure; SameSite=Lax";
    discoveryFetch = createHpkeFetch({
      endpoint,
      key: { kind: "discover" },
      targetOrigin: "https://api.example.test",
      psk,
      pskId,
    });
    const discovered = await discoveryFetch("https://api.example.test/items", {
      headers: { authorization: "Bearer inner-only" },
    });
    if (discovered.status !== 200 || (await discovered.text()) !== "browser-discovery-ok") {
      throw new Error("browser discovery exchange did not complete");
    }
    const fault = await globalThis.fetch(`${endpoint}?bad=1`, { credentials: "omit" });
    if (fault.status !== 400 || !(await fault.text()).includes("query")) {
      throw new Error("browser could not read a cross-origin endpoint fault");
    }
    badDiscoveryFetch = createHpkeFetch({
      endpoint: `${apiOrigin}/missing`,
      key: { kind: "discover" },
      targetOrigin: "https://api.example.test",
      psk,
      pskId,
    });
    let badGetFailed = false;
    try {
      await badDiscoveryFetch("https://api.example.test/items");
    } catch (error) {
      badGetFailed = error?.code === "discovery_status" && error?.statusCode === 404;
    }
    if (!badGetFailed) throw new Error("bad key GET did not stop the protected request");
    const statsResponse = await globalThis.fetch(`${apiOrigin}/stats`, { credentials: "omit" });
    const stats = await statsResponse.json();
    if (
      statsResponse.status !== 200 || stats.key_get !== 1 || stats.preflight < 1 ||
      stats.protected_post !== 1 || stats.bad_get !== 1 || stats.key_get_had_credentials
    ) {
      throw new Error(`browser discovery CORS checks failed: ${JSON.stringify(stats)}`);
    }
    await report("pass");
  } catch (error) {
    const detail = error instanceof Error ? `${error.stack ?? error.message}` : String(error);
    await report("fail", detail);
  } finally {
    hpkeFetch?.close();
    discoveryFetch?.close();
    badDiscoveryFetch?.close();
    server?.close();
  }
</script>
