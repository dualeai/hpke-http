name: CodSpeed

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  RUST_TOOLCHAIN: 1.87.0
  WASM_BINDGEN_VERSION: 0.2.128

jobs:
  rust:
    name: Rust core benchmarks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - name: Build CodSpeed benchmarks
        run: |
          cargo install cargo-codspeed --version 5.0.2 --locked
          cargo codspeed build -p hpke-http -m simulation -m memory
      - name: Measure Rust transactions
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation,memory
          run: cargo codspeed run -p hpke-http

  python:
    name: Python binding benchmarks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - name: Build the Python binding
        run: |
          uv sync --project python --frozen --extra dev
          uv run --project python --frozen --no-sync maturin develop --release --locked \
            --manifest-path python/native/Cargo.toml
      - name: Measure Python transactions
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: uv run --project python --frozen --no-sync pytest python/benchmarks/ --codspeed -q -o addopts=

  typescript:
    name: Node/WASM binding benchmarks
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - name: Build the Node/WASM binding
        run: |
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
          npm ci --prefix typescript --ignore-scripts
          npm --prefix typescript run build
      - name: Measure Node/WASM transactions
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        with:
          mode: simulation
          run: npm --prefix typescript run benchmark
