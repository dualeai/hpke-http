name: CodSpeed

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allow CodSpeed to trigger backtest performance analysis
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: codspeed-macro
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v7.1.6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install-deps

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation,memory
          run: uv run pytest tests/benchmarks/ --codspeed -v --no-cov -p no:xdist -o "addopts="
