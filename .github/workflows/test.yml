name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }} / ${{ matrix.test-step }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404-arm, blacksmith-6vcpu-macos-15, blacksmith-6vcpu-macos-26]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.13t", "3.14t"]
        test-step: [standard, root, slow]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install-deps

      - name: Run static checks
        if: matrix.test-step == 'standard'
        run: make test-static

      - name: Run tests
        if: matrix.test-step == 'standard'
        run: make test-func-ci

      - name: Run root-required tests (tcpdump network capture)
        if: matrix.test-step == 'root'
        run: sudo env "PATH=$PATH" make test-func-root

      - name: Run slow tests (large payloads)
        if: matrix.test-step == 'slow'
        run: make test-func-slow
